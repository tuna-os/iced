name: Document
on: [push, pull_request]
permissions: {}

jobs:
  all:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
    - uses: hecrj/setup-rust-action@v2.0.1
      with:
        rust-version: nightly
    - uses: actions/checkout@v2.8.0 # zizmor: ignore[artipacked] actions-gh-pages pushes the docs later in this job
    - name: Generate documentation
      run: |
        RUSTDOCFLAGS="--cfg docsrs" \
          cargo doc --no-deps --all-features \
          -p futures-core \
          -p iced_beacon \
          -p iced_core \
          -p iced_debug \
          -p iced_devtools \
          -p iced_futures \
          -p iced_graphics \
          -p iced_highlighter \
          -p iced_renderer \
          -p iced_runtime \
          -p iced_tiny_skia \
          -p iced_wgpu \
          -p iced_widget \
          -p iced_winit \
          -p iced_test \
          -p iced
    - name: Write CNAME file
      run: echo 'docs.iced.rs' > ./target/doc/CNAME
    - name: Copy redirect file as index.html
      run: cp docs/redirect.html target/doc/index.html
    - name: Publish documentation
      if: github.ref == 'refs/heads/master'
      uses: peaceiris/actions-gh-pages@v3.9.3
      with:
        deploy_key: ${{ secrets.DOCS_DEPLOY_KEY }}
        external_repository: iced-rs/docs
        publish_dir: ./target/doc
